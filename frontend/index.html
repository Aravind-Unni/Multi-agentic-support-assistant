<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trendly Support Assistant</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="uiverse-input.css" />
</head>
<body>

  <!-- Cursor-following ambient glow -->
  <div class="glow"></div>

  <!-- Landing / hero screen -->
  <div class="landing" id="landing">
    <div class="landing-inner">
      <div class="header-avatar landing-avatar">
        <b></b>
        <span class="header-avatar-emoji">🛍️</span>
      </div>
      <h1 class="landing-title">
        Support,
        <span class="landing-highlight">reimagined.</span>
      </h1>
      <p class="landing-sub">
        Real-time order tracking, returns, and refunds — answered instantly
        by Trendly's AI.
      </p>
      <button id="startChattingBtn" class="landing-cta">
        <span>💬</span>
        <span>Start chatting</span>
        <span class="landing-cta-arrow">→</span>
      </button>

      <p class="landing-or">or jump straight in</p>

      <div class="landing-quick-cards" id="landingQuickCards">
        <button class="landing-card" data-prompt="Track my order">
          <span class="landing-card-icon icon-track">🚚</span>
          <span>Track my order</span>
        </button>
        <button class="landing-card" data-prompt="What is your return policy?">
          <span class="landing-card-icon icon-return">↩️</span>
          <span>Return policy</span>
        </button>
        <button class="landing-card" data-prompt="What is my refund status?">
          <span class="landing-card-icon icon-refund">💰</span>
          <span>Refund status</span>
        </button>
      </div>
    </div>
  </div>

  <div class="chat-container hidden" id="chatContainer">

    <!-- Header -->
    <div class="chat-header">
      <div class="header-avatar">
        <b></b>
        <span class="header-avatar-emoji">🛍️</span>
      </div>
      <h1>Trendly Support Assistant</h1>
      <button id="newChatBtn">New chat</button>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="message assistant">
        Hi, How can I help you today?
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator hidden" id="typingIndicator">
      <svg class="pl" width="32" height="32" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="pl-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#a5b4fc" />
          </linearGradient>
        </defs>
        <circle class="pl__ring pl__ring--a" cx="64" cy="64" r="105" fill="none" stroke="#6366f1" stroke-width="20" stroke-dasharray="0 660" stroke-dashoffset="-330" stroke-linecap="round"></circle>
        <circle class="pl__ring pl__ring--b" cx="64" cy="64" r="35" fill="none" stroke="#818cf8" stroke-width="20" stroke-dasharray="0 220" stroke-dashoffset="-110" stroke-linecap="round"></circle>
        <circle class="pl__ring pl__ring--c" cx="64" cy="64" r="70" fill="none" stroke="#a5b4fc" stroke-width="20" stroke-dasharray="0 440" stroke-linecap="round"></circle>
        <circle class="pl__ring pl__ring--d" cx="64" cy="64" r="70" fill="none" stroke="#4f46e5" stroke-width="20" stroke-dasharray="0 440" stroke-linecap="round"></circle>
      </svg>
    </div>

    <!-- Quick suggestion chips -->
    <div class="quick-chips" id="quickChips">
      <button class="chip" data-prompt="Track my order">
        <span class="chip-icon">📦</span>
        <span>Track Order</span>
      </button>
      <button class="chip" data-prompt="What is your return policy?">
        <span class="chip-icon">🛡️</span>
        <span>Return Policy</span>
      </button>
      <button class="chip" data-prompt="What is my refund status?">
        <span class="chip-icon">💳</span>
        <span>Refund Status</span>
      </button>
    </div>

    <!-- Input bar (Uiverse glowing search-style input) -->
    <form id="chatForm">
      <div class="poda-grid"></div>
      <div id="poda">
        <div class="poda-glow"></div>
        <div class="poda-darkBorderBg"></div>
        <div class="poda-white"></div>
        <div class="poda-border"></div>
        <div id="main">
          <input
            id="chatInput"
            class="poda-input"
            type="text"
            name="text"
            placeholder="Ask about orders, policies, or returns..."
            autocomplete="off"
          />
          <div id="input-mask"></div>
          <div id="pink-mask"></div>
          <div class="filterBorder"></div>
          <div id="filter-icon" title="Clear chat">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 4h18l-7 9v6l-4 2v-8L3 4z" stroke="#d6d6e6" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </div>
          <div id="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" viewBox="0 0 24 24" height="17" fill="none">
              <circle stroke="#d6d6e6" stroke-width="1.5" r="8" cy="10.5" cx="10.5"></circle>
              <line stroke-linecap="round" stroke-width="1.5" stroke="#d6d6e6" y2="16.65" x2="16.65" y1="21" x1="21"></line>
            </svg>
          </div>
        </div>
      </div>
    </form>

  </div>

  <script src="app.js"></script>
</body>
</html>
